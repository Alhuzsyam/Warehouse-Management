version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: warehouse_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: warehouse_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - warehouse_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: warehouse_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - warehouse_network

volumes:
  mysql_data:

networks:
  warehouse_network:
    driver: bridge